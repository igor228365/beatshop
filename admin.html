<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка BEATSHOP</title>
<body style="font:16px system-ui;max-width:760px;margin:20px auto;padding:0 16px">
<h1>Заявки</h1><div id="l">Загрузка…</div>
<script>
const key = sessionStorage.k || (sessionStorage.k = prompt("Ключ админа (ADMIN_KEY)"));
const H = {"x-admin-key": key, "content-type": "application/json"};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load() {
  const r = await fetch("/admin/api/orders", {headers: H});
  if (!r.ok) { sessionStorage.removeItem("k"); return l.textContent = "Неверный ключ. Обнови страницу."; }
  const o = await r.json();
  l.innerHTML = o.map(x => `<div style="border:1px solid #ccc;border-radius:10px;padding:12px;margin:10px 0">
    <b>${x.plan ? "Подписка " + esc(x.plan) : "Заказ"}</b> · ${esc(x.sum)} · ${x.status}<br>
    ${esc(x.userName)} (${esc(x.userId)})<br>Контакт: ${esc(x.contact)}<br>${x.items.map(esc).join(", ")}<br>
    ${x.status === "pending" ? `<button onclick="done(${x.id})">${x.plan ? "Оплата пришла: включить на 30 дней" : "Отметить выполненным"}</button>` : ""}</div>`).join("") || "Заявок нет";
}
async function done(id) { await fetch("/admin/api/done", {method: "POST", headers: H, body: JSON.stringify({id})}); load(); }
load();
</script>
